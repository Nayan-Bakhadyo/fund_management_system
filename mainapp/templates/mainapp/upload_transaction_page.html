{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload Transaction - BE Investment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'mainapp/assets/BE_logo.png' %}">
    <link rel="stylesheet" href="{% static 'mainapp/user_dashboard_modern.css' %}">
    <style>
        .page-title   { font-size:1.5rem; font-weight:700; color:var(--text-primary); margin-bottom:.2rem; }
        .page-subtitle{ color:var(--text-secondary); font-size:.9rem; }
        .form-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            max-width: 540px;
        }
    </style>
</head>
<body>
<div class="dashboard-container">

    {% include 'mainapp/_sidebar.html' with active_page='upload' %}
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="main-content" id="mainContent">
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle d-md-none" id="sidebarToggle">&#9776;</button>
                <div class="brand-name d-none d-lg-block"><h2>Upload Transaction</h2></div>
            </div>
            <div class="topbar-right">
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name={{ user.get_full_name|default:user.username|urlencode }}" alt="User DP" class="user-dp">
                    <div class="user-info">
                        <div class="user-name">{{ user.get_full_name|default:user.username }}</div>
                        <div class="user-email" title="{{ user.email }}">{{ user.email }}</div>
                    </div>
                    <a href="{% url 'logout' %}" class="logout-link">Log out</a>
                </div>
            </div>
        </header>

        <main class="dashboard-main">
            <div class="mb-4">
                <div class="page-title"><i class="bi bi-upload me-2" style="color:#c0a062;"></i>Upload Transaction</div>
                <div class="page-subtitle">Submit your transaction screenshot for verification</div>
            </div>

            <div class="form-card">
                <form id="upload-transaction-form-page" enctype="multipart/form-data" method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Transaction Screenshot/Receipt</label>
                        <input type="file" name="transaction_file" class="form-control" accept="image/*,application/pdf" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Transaction Amount (NRs.)</label>
                        <input type="number" name="amount" class="form-control" step="0.01" placeholder="Enter amount" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description (optional)</label>
                        <textarea name="description" class="form-control" rows="3" maxlength="255" placeholder="Optional note about this transaction"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-upload me-1"></i> Upload
                    </button>
                    <div id="upload-page-message" class="mt-3"></div>
                </form>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
    var sidebar = document.getElementById('sidebar');
    var toggle  = document.getElementById('sidebarToggle');
    var overlay = document.getElementById('sidebar-overlay');
    if (toggle) toggle.addEventListener('click', function () {
        var open = sidebar.classList.toggle('open');
        document.body.classList.toggle('sidebar-open', open);
        if (overlay) overlay.style.display = open ? 'block' : 'none';
    });
    if (overlay) overlay.addEventListener('click', function () {
        sidebar.classList.remove('open');
        document.body.classList.remove('sidebar-open');
        overlay.style.display = 'none';
    });

    document.getElementById('upload-transaction-form-page').addEventListener('submit', function (e) {
        e.preventDefault();
        var form = e.target;
        var msg  = document.getElementById('upload-page-message');
        msg.innerHTML = '<div class="alert alert-info"><i class="bi bi-hourglass-split me-2"></i>Uploading...</div>';
        fetch('{% url "upload_transaction" %}', {
            method: 'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            body: new FormData(form)
        })
        .then(function(r){ return r.json(); })
        .then(function(data) {
            if (data.success) {
                msg.innerHTML = '<div class="alert alert-success"><i class="bi bi-check-circle me-2"></i>Transaction uploaded successfully. Your upload will be reviewed by the fund manager.</div>';
                form.reset();
            } else {
                var errText = data.error || 'Upload failed. Please try again.';
                msg.innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i>' + errText + '</div>';
            }
        })
        .catch(function() {
            msg.innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i>An unexpected error occurred. Please try again.</div>';
        });
    });
})();
</script>
</body>
</html>
