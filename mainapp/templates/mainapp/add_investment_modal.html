{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Investment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="modal fade" id="addInvestmentModal" tabindex="-1" aria-labelledby="addInvestmentModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="addInvestmentForm" method="post" autocomplete="off">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="addInvestmentModalLabel">Add Investment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="investmentAlert"></div>

          <div class="mb-3">
            <label for="investment_name" class="form-label">Investment Name</label>
            <input type="text" class="form-control" id="investment_name" name="investment_name" maxlength="100" required>
          </div>

          <div class="mb-3">
            <label for="investment_category" class="form-label">Investment Category</label>
            <select class="form-control" id="investment_category" name="investment_category" required>
              <option value="">Select Category</option>
              {% for category in categories %}
                <option value="{{ category.category_id }}" data-name="{{ category.category_name|lower }}">
                  {{ category.category_name }}
                </option>
              {% endfor %}
            </select>
          </div>

          <!-- Share market fields -->
          <div class="mb-3" id="shareSymbolField" style="display:none;">
            <label for="share_symbol" class="form-label">Share Symbol</label>
            <input type="text" class="form-control" id="share_symbol" name="share_symbol" maxlength="20" placeholder="e.g., NABIL, NICA, ADBL">
            <div class="form-text">Stock symbol for share market investments</div>
          </div>

          <!-- Loan fields -->
          <div id="loanFields" style="display:none;">
            <div class="mb-3">
              <label for="borrower_name" class="form-label">Borrower Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="borrower_name" name="borrower_name" maxlength="200" placeholder="Full name or company name">
            </div>
            <div class="row g-2 mb-3">
              <div class="col-7">
                <label for="interest_rate" class="form-label">Interest Rate (%) <span class="text-danger">*</span></label>
                <input type="number" step="0.01" min="0" class="form-control" id="interest_rate" name="interest_rate" placeholder="e.g., 1.5">
              </div>
              <div class="col-5">
                <label for="interest_rate_period" class="form-label">Period <span class="text-danger">*</span></label>
                <select class="form-control" id="interest_rate_period" name="interest_rate_period">
                  <option value="">Select</option>
                  <option value="monthly">Per Month</option>
                  <option value="yearly">Per Year</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label for="loan_maturity_date" class="form-label">Maturity Date</label>
              <input type="date" class="form-control" id="loan_maturity_date" name="loan_maturity_date">
              <div class="form-text">Date when the loan is due to be fully repaid</div>
            </div>
            <!-- Expected interest preview -->
            <div id="interestPreview" class="alert alert-info py-2 px-3 small" style="display:none;"></div>
          </div>

          <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-control" id="status" name="status" required>
              <option value="open">Open</option>
              <option value="closed">Closed</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn" style="background:#bfa14a;color:#14213d;font-weight:600;">Add Investment</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
(function () {
  var categorySelect = document.getElementById('investment_category');
  var shareField    = document.getElementById('shareSymbolField');
  var loanFields    = document.getElementById('loanFields');
  var rateInput     = document.getElementById('interest_rate');
  var periodSelect  = document.getElementById('interest_rate_period');
  var preview       = document.getElementById('interestPreview');

  function updateFields() {
    var selected = categorySelect.options[categorySelect.selectedIndex];
    var name = selected ? (selected.getAttribute('data-name') || '') : '';
    shareField.style.display = name === 'share market' ? '' : 'none';
    loanFields.style.display  = name === 'loan' ? '' : 'none';
    updatePreview();
  }

  function updatePreview() {
    var rate   = parseFloat(rateInput ? rateInput.value : '');
    var period = periodSelect ? periodSelect.value : '';
    if (!rate || !period) { preview.style.display = 'none'; return; }
    var monthly = period === 'monthly' ? rate : rate / 12;
    preview.textContent = 'Expected interest: ' + monthly.toFixed(2) + '% per month  |  ' + (monthly * 12).toFixed(2) + '% per year';
    preview.style.display = '';
  }

  if (categorySelect) categorySelect.addEventListener('change', updateFields);
  if (rateInput)       rateInput.addEventListener('input', updatePreview);
  if (periodSelect)    periodSelect.addEventListener('change', updatePreview);
  updateFields();
})();
</script>

</body>
</html>
