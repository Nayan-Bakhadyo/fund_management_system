{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Settings - BE Investment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'mainapp/assets/BE_logo.png' %}">
    <link rel="stylesheet" href="{% static 'mainapp/user_dashboard_modern.css' %}">
    <style>
        .page-title   { font-size:1.5rem; font-weight:700; color:var(--text-primary); margin-bottom:.2rem; }
        .page-subtitle{ color:var(--text-secondary); font-size:.9rem; }
        .form-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            max-width: 540px;
        }
    </style>
</head>
<body>
<div class="dashboard-container">

    {% include 'mainapp/_sidebar.html' with active_page='payment' %}
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="main-content" id="mainContent">
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle d-md-none" id="sidebarToggle">&#9776;</button>
                <div class="brand-name d-none d-lg-block"><h2>Payment Settings</h2></div>
            </div>
            <div class="topbar-right">
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name={{ user.get_full_name|default:user.username|urlencode }}" alt="User DP" class="user-dp">
                    <div class="user-info">
                        <div class="user-name">{{ user.get_full_name|default:user.username }}</div>
                        <div class="user-email" title="{{ user.email }}">{{ user.email }}</div>
                    </div>
                    <a href="{% url 'logout' %}" class="logout-link">Log out</a>
                </div>
            </div>
        </header>

        <main class="dashboard-main">
            <div class="mb-4">
                <div class="page-title"><i class="bi bi-pencil-square me-2" style="color:#c0a062;"></i>Payment Settings</div>
                <div class="page-subtitle">View and update your recurring payment information</div>
            </div>

            <div class="form-card">
                <form id="payment-detail-form-page" method="post" action="{% url 'payment_detail' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Recurring Payment Amount</label>
                        <input type="number" name="recurring_payment_amount" class="form-control" value="{{ payment_obj.recurring_payment_amount|default_if_none:'' }}" step="any">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Payment Date</label>
                        <input type="date" name="payment_date" class="form-control" value="{{ payment_obj.payment_date|date:'Y-m-d'|default_if_none:'' }}">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-floppy me-1"></i> Save
                    </button>
                    <div id="payment-page-message" class="mt-3"></div>
                </form>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
    var sidebar = document.getElementById('sidebar');
    var toggle  = document.getElementById('sidebarToggle');
    var overlay = document.getElementById('sidebar-overlay');
    if (toggle) toggle.addEventListener('click', function () {
        var open = sidebar.classList.toggle('open');
        document.body.classList.toggle('sidebar-open', open);
        if (overlay) overlay.style.display = open ? 'block' : 'none';
    });
    if (overlay) overlay.addEventListener('click', function () {
        sidebar.classList.remove('open');
        document.body.classList.remove('sidebar-open');
        overlay.style.display = 'none';
    });

    document.getElementById('payment-detail-form-page').addEventListener('submit', function (e) {
        e.preventDefault();
        var form = e.target;
        var msg  = document.getElementById('payment-page-message');
        fetch('{% url "payment_detail" %}', {
            method: 'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            body: new FormData(form)
        })
        .then(function(r){ return r.json(); })
        .then(function(data) {
            if (data.success) {
                msg.innerHTML = '<div class="alert alert-success"><i class="bi bi-check-circle me-2"></i>Payment settings saved successfully.</div>';
            } else {
                msg.innerHTML = '<div class="alert alert-danger">Save failed. Please try again.</div>';
            }
        });
    });
})();
</script>
</body>
</html>
